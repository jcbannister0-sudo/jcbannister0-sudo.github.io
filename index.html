<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';">
<title>VEBL — rare-answer economics trivia</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c542;--mint:#4ef2a3;--ink:#e9f0ff;--mute:#8a9bc0;--panel:#0e1830;--edge:#2c4170;--red:#ff5a6e;
--t1:#c98a56;--t2:#5fb3ff;--t3:#4ef2a3;--t4:#b48cff;--t5:#ff9f43;--t6:#f5c542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05050f;color:var(--ink);font-family:'IBM Plex Mono',monospace}
#scene{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
/* CRT */
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;background:var(--red);opacity:0;transition:opacity .5s}
.px{font-family:'Silkscreen',monospace;text-transform:uppercase}
.vt{font-family:'VT323',monospace}
.chroma{color:#fff;text-shadow:-3px 0 var(--mint),3px 0 var(--gold),0 0 18px rgba(245,197,66,.35)}
.panel{background:rgba(10,18,38,.88);border:2px solid var(--edge);
 clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}
.btn{font-family:'Silkscreen',monospace;text-transform:uppercase;letter-spacing:4px;font-size:15px;border:0;cursor:pointer;padding:15px 18px;width:100%;
 color:#0b0f1e;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
.btn.gold{background:var(--gold);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 0 22px rgba(245,197,66,.35)}
.btn.mint{background:var(--mint);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 0 22px rgba(78,242,163,.3)}
.btn.ghost{background:rgba(10,18,38,.9);color:var(--ink);border:2px solid var(--mint);box-shadow:0 0 14px rgba(78,242,163,.25)}
.btn.small{font-size:11px;letter-spacing:3px;padding:10px 12px;width:auto}
.layer{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.layer>*{pointer-events:auto}
.hide{display:none!important}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:10px 10px 0;align-items:flex-start}
.hbox{padding:6px 12px 4px;min-width:104px}
.hbox .lbl{font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:3px;color:var(--mute)}
.hbox .val{font-family:'VT323',monospace;font-size:28px;line-height:1}
#hCap{color:var(--mint)}#hScore{color:var(--gold);text-align:right}
.hmid{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;padding-top:8px}
.pips{display:flex;gap:4px}.pip{width:12px;height:12px;background:#1b2a4d;border:1px solid #33497a}
.pip.cur{background:var(--ink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.hmid .lbl{font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:3px;color:var(--mute);margin-top:6px}
/* home */
#home{justify-content:flex-start;padding:9vh 16px 16px;text-align:center}
.title{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(34px,9.6vw,80px);letter-spacing:4px;line-height:1}
.sub{font-family:'Silkscreen',monospace;color:#1a4d7a;letter-spacing:10px;font-size:clamp(13px,3.4vw,20px);margin-top:14px;text-shadow:0 0 1px #fff}
.tag{color:#294768;font-size:13px;letter-spacing:1px;margin-top:12px;font-weight:600}
.homebot{position:fixed;left:0;right:0;bottom:0;padding:60px 16px 22px;background:linear-gradient(transparent,rgba(5,8,20,.88) 45%);display:flex;justify-content:center}
.homebot .in{width:100%;max-width:480px}
details{font-size:13px;color:var(--mute);margin-bottom:10px;text-align:left}
details summary{font-family:'Silkscreen',monospace;letter-spacing:3px;font-size:11px;cursor:pointer;color:var(--ink);list-style:none}
details summary::before{content:"► "}details[open] summary::before{content:"▼ "}
details .panel{padding:12px;margin-top:8px;line-height:1.55}
.trow{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:12px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px;flex-wrap:wrap}
.meta span{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:2px;color:var(--mute)}
/* question */
#qPanel{margin-top:96px;width:calc(100% - 24px);max-width:520px;padding:18px 20px}
.qnum{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:4px;color:var(--gold)}
.qtext{font-weight:700;font-size:clamp(20px,5.2vw,28px);line-height:1.25;margin:10px 0 8px}
.qhint{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:2px;color:var(--mute)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:12px;background:linear-gradient(transparent,rgba(5,5,15,.85) 40%)}
#bar form{display:flex;gap:8px;align-items:center;width:100%;max-width:560px}
.errmsg{width:100%;max-width:560px;margin-bottom:8px;padding:7px 12px;background:rgba(36,8,18,.94);border:2px solid var(--red);color:#ffb3bc;font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:1.5px;text-align:center;line-height:1.4;box-shadow:0 0 14px rgba(255,90,110,.28)}
#ans.bad{border-color:var(--red);box-shadow:0 0 16px rgba(255,90,110,.4)}
.dial{position:relative;width:54px;height:54px;flex:none}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dial b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'VT323',monospace;font-size:26px;color:var(--mint)}
.dial.low b{color:var(--red);animation:blink .5s steps(2) infinite}
#ans{flex:1;min-width:0;height:54px;background:#0a1226;border:2px solid var(--mint);color:var(--ink);font:500 17px 'IBM Plex Mono',monospace;padding:0 14px;outline:none;box-shadow:0 0 16px rgba(78,242,163,.2)}
#ans::placeholder{color:#4e6491}
#buyBtn{width:auto;height:54px;padding:0 16px;font-size:13px;letter-spacing:3px}
.tbar{position:absolute;left:0;bottom:0;height:3px;background:var(--mint)}
/* reveal */
#reveal{justify-content:center;padding-bottom:22vh!important;text-align:center;padding:20px}
#reveal{background:radial-gradient(ellipse 60% 45% at 50% 42%,rgba(5,8,22,.72),transparent 75%)}
#reveal>div{text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.6)}
#rIcon{width:120px;height:120px;margin:0 auto 18px;animation:float 2.4s ease-in-out infinite}
#rIcon svg{width:100%;height:100%;shape-rendering:crispEdges}
@keyframes float{50%{transform:translateY(-8px)}}
#rTier{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(22px,6.4vw,46px);letter-spacing:clamp(2px,.8vw,6px)}
#rAns{font-weight:600;font-size:18px;margin:14px 0 10px}
#rPts{font-family:'VT323',monospace;font-size:clamp(22px,6vw,28px)}
#rFlav{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:3px;color:#c9d4f0;margin-top:10px}
#ans.lev{border-color:var(--gold);box-shadow:0 0 18px rgba(245,197,66,.45)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.seg button{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:1px;padding:9px 6px;cursor:pointer;background:rgba(10,18,38,.9);border:2px solid var(--edge);color:var(--mute);transition:all .12s}
.seg button.on{border-color:var(--mint);color:var(--ink);box-shadow:0 0 12px rgba(78,242,163,.25)}
.seg button.on.blitz{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(245,197,66,.28)}
.seg button.on.study{border-color:var(--t2);color:var(--t2);box-shadow:0 0 12px rgba(95,179,255,.28)}
.qtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tbtn{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:1.5px;padding:7px 10px;cursor:pointer;background:rgba(10,18,38,.9);border:2px solid var(--edge);color:var(--mute);transition:all .12s}
.tbtn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.tbtn.on{background:rgba(245,197,66,.18);border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(245,197,66,.35)}
.tbtn.tip:hover:not(:disabled){border-color:var(--t4);color:var(--t4)}
.tbtn.pass:hover:not(:disabled){border-color:var(--red);color:var(--ink)}
.tbtn:disabled{opacity:.38;cursor:not-allowed}
.tipbox{margin-top:10px;padding:8px 10px;background:rgba(180,140,255,.12);border:1px dashed var(--t4);font-size:12px;color:var(--ink);letter-spacing:1px;line-height:1.45}
.chcard{padding:12px 14px;margin-bottom:10px;border-color:var(--gold);text-align:left;box-shadow:0 0 18px rgba(245,197,66,.22)}
.chcard .chtitle{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:2px;color:var(--gold)}
.chcard .chsub{font-size:12px;color:var(--ink);margin-top:4px;line-height:1.4}
.h2h{padding:14px;margin-bottom:16px;border-color:var(--gold);text-align:center}
.h2h .h2ht{font-family:'Silkscreen',monospace;font-size:14px;letter-spacing:3px;color:var(--gold)}
.h2h .h2hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:12px}
.h2h .h2hcol{padding:8px;background:rgba(14,24,48,.7);border:1px solid var(--edge)}
.chform{display:flex;gap:8px;margin-top:8px}
.chform input{flex:1;min-width:0;height:40px;background:#0a1226;border:2px solid var(--edge);color:var(--ink);font:500 13px 'IBM Plex Mono',monospace;padding:0 10px;outline:none}
.chform input:focus{border-color:var(--mint)}
.rtag{font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:1px;padding:2px 5px;border:1px solid currentColor;margin-left:4px}
.pop{animation:popin .45s cubic-bezier(.3,1.7,.5,1) both}
@keyframes popin{from{transform:scale(.4);opacity:0}}
#nextWrap{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;z-index:21}
#nextWrap .btn{width:auto;min-width:200px}
/* results */
#results{overflow-y:auto;background:rgba(5,6,16,.72);padding:24px 16px 40px;display:block}
.res{max-width:520px;margin:0 auto}
.rhead{display:flex;justify-content:space-between;align-items:center}
.rhead .chroma{font-family:'Silkscreen',monospace;font-weight:700;font-size:24px;letter-spacing:2px}
.rhead .px{font-size:10px;letter-spacing:3px;color:var(--mute)}
.bigscore{display:flex;align-items:flex-end;gap:12px;margin:18px 0 4px}
.bigscore .vt{font-size:96px;line-height:.8;color:#fff;text-shadow:3px 3px 0 #1d2b52}
.bigscore .cap{font-family:'VT323',monospace;font-size:30px;color:var(--mint);padding-bottom:4px}
.rankline{font-family:'Silkscreen',monospace;font-size:12px;letter-spacing:3px;color:var(--gold);margin-bottom:22px}
.sec{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:3px;color:var(--mute);display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec::after{content:"";flex:1;border-top:1px dashed #2c4170}
#log svg{width:100%;height:auto;display:block}
.ladder .lr{display:grid;grid-template-columns:18px 60px 1fr;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid #1d2b52;font-size:12px;color:var(--mute)}
.ladder .lr.on{color:#fff;background:rgba(245,197,66,.08)}
.ladder .lr b{font-family:'VT323',monospace;font-size:18px}
.recap .rr{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid #1d2b52;font-size:13px}
.recap .rr span:first-child{color:var(--mute)}
.btnrow{display:flex;gap:8px;margin-top:22px}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.5);opacity:0;z-index:30;font-family:'Silkscreen',monospace;font-weight:700;letter-spacing:3px;font-size:18px;
 color:#0b0f1e;background:var(--gold);padding:10px 16px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 30px rgba(245,197,66,.6);transition:all .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.bigshake{animation:bigshake .65s cubic-bezier(.36,.07,.19,.97)}
@keyframes bigshake{
  10%{transform:translate(-11px,-5px) rotate(-1.2deg)}
  20%{transform:translate(10px,6px) rotate(1.2deg)}
  30%{transform:translate(-10px,4px) rotate(-1deg)}
  40%{transform:translate(9px,-6px) rotate(1deg)}
  50%{transform:translate(-7px,4px) rotate(-.7deg)}
  65%{transform:translate(6px,-3px) rotate(.6deg)}
  80%{transform:translate(-4px,2px) rotate(-.3deg)}
  100%{transform:none}
}

#bubble{position:fixed;z-index:16;transform:translate(-50%,-100%);background:#fff;color:#0b0f1e;font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:1px;padding:6px 9px;white-space:nowrap;pointer-events:none;
 box-shadow:3px 3px 0 rgba(0,0,0,.35);clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 9px),calc(100% - 3px) calc(100% - 9px),calc(100% - 3px) calc(100% - 6px),calc(50% + 6px) calc(100% - 6px),50% 100%,calc(50% - 6px) calc(100% - 6px),3px calc(100% - 6px),3px calc(100% - 9px),0 calc(100% - 9px))}
#bubble{padding-bottom:12px}
.bpop{animation:bpop .3s cubic-bezier(.3,1.8,.5,1)}@keyframes bpop{from{transform:translate(-50%,-100%) scale(.3)}}
#muteBtn{position:fixed;top:10px;right:10px;z-index:25;background:rgba(10,18,38,.85);border:2px solid #2c4170;color:#fff;font-size:15px;width:36px;height:36px;cursor:pointer;padding:0}
#rTier.stamp{display:inline-block;border:4px solid currentColor;padding:6px 16px 4px;transform:rotate(-3deg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.slam{animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{0%{transform:scale(3) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-3deg)}}
#rays{position:fixed;left:50%;top:30%;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:9;pointer-events:none;opacity:0;transition:opacity .6s;
 background:repeating-conic-gradient(rgba(245,197,66,.28) 0 8deg,transparent 8deg 22deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 18s linear infinite}
#rays.on{opacity:1}@keyframes spin{to{transform:rotate(360deg)}}
#jack{font-family:'Silkscreen',monospace;font-weight:700;letter-spacing:6px;font-size:13px;color:#1a1300;background:var(--gold);display:inline-block;padding:4px 10px;margin-bottom:12px;box-shadow:0 0 24px rgba(245,197,66,.8)}
.jackpot #rTier{animation:slam .45s cubic-bezier(.2,1.6,.4,1) both,glow 1s ease-in-out .5s infinite alternate}
@keyframes glow{to{text-shadow:0 0 30px #f5c542,0 0 60px #f5c542;filter:brightness(1.25)}}
#rMult{font-family:'VT323',monospace;font-size:22px;color:#c9d4f0;margin-top:2px}
.jackpot #rMult{font-size:30px;color:var(--gold);text-shadow:0 0 18px rgba(245,197,66,.8)}
#rMeta{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:2px;color:var(--mute);margin-top:6px}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
#passBtn{font-size:10px;letter-spacing:2px;padding:6px 10px;border-color:var(--edge);color:var(--mute);box-shadow:none}
#passBtn:hover{border-color:var(--red);color:var(--ink)}
details.rdet{margin:0;border-bottom:1px solid #1d2b52}
details.rdet summary{font-family:'IBM Plex Mono',monospace;letter-spacing:0;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;color:var(--ink)}
details.rdet summary::before{content:none}
details.rdet summary .rcat{color:var(--mute);display:flex;align-items:center;gap:6px}
details.rdet summary .rcat::before{content:"▸";font-size:11px;color:#5f73a0;transition:transform .12s}
details.rdet[open] summary .rcat::before{content:"▾";color:var(--gold)}
details.rdet .rdet-body{padding:0 4px 10px 16px;font-size:12px;color:var(--mute);line-height:1.5}
details.rdet .rdet-q{color:#c9d4f0;margin-bottom:4px}
#archive{overflow-y:auto;background:rgba(5,6,16,.9);padding:24px 16px 40px;display:block;z-index:35}
.arch{max-width:540px;margin:0 auto}
.archhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.archhead .chroma{font-family:'Silkscreen',monospace;font-weight:700;font-size:22px;letter-spacing:2px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.statbox{padding:8px 6px;text-align:center}
.statbox .slbl{font-family:'Silkscreen',monospace;font-size:8px;letter-spacing:2px;color:var(--mute)}
.statbox .sval{font-family:'VT323',monospace;font-size:24px;line-height:1.1;color:var(--gold);margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:1px;padding:10px 6px;cursor:pointer;background:rgba(10,18,38,.88);border:2px solid var(--edge);color:var(--mute)}
.tab.on{border-color:var(--mint);color:var(--ink);box-shadow:0 0 12px rgba(78,242,163,.2)}
.acard{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px}
.acard .aleft{min-width:0;flex:1}
.acard .atitle{font-family:'Silkscreen',monospace;font-size:12px;letter-spacing:2px;color:var(--ink)}
.acard .adate{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.35}
.acard .agrid{font-size:13px;letter-spacing:2px;margin-top:6px}
.acard .aright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.acard .abadge{font-family:'VT323',monospace;font-size:19px;color:var(--gold);white-space:nowrap}
.archnote{font-size:12px;color:var(--mute);line-height:1.5;text-align:center;margin-top:14px}
@media (max-width:520px){#qPanel{max-width:calc(100% - 28px)!important}#reveal{padding-left:20px!important;padding-right:20px!important}.statrow{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="crt"></div><div id="flash"></div>
<div class="toast" id="toast"></div>
<div id="rays"></div>
<div id="bubble" class="hide"></div>
<button id="muteBtn" onclick="toggleMute()">🔊</button>

<div id="hud" class="hide">
  <div class="hbox panel"><div class="lbl">MKT CAP</div><div class="val" id="hCap">$1.00</div></div>
  <div class="hmid"><div class="pips" id="pips"></div><div class="lbl" id="hProm">PROMPT 1 OF 7</div></div>
  <div class="hbox panel"><div class="lbl" style="text-align:right">SCORE</div><div class="val" id="hScore">0</div></div>
</div>

<div id="home" class="layer"></div>
<div id="question" class="layer hide"><div id="qPanel" class="panel"></div></div>

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/&/g," and ").replace(/['’]s\b/g,"").replace(/['’]/g,"")
  .replace(/[^a-z0-9 ]/g," ")
  .replace(/\blabour\b/g,"labor").replace(/\bbehaviour/g,"behavior").replace(/\bfavour/g,"favor")
  .replace(/\bcolour/g,"color").replace(/\bneighbour/g,"neighbor").replace(/\bcentre/g,"center")
  .replace(/\bdefence\b/g,"defense").replace(/\bprogramme/g,"program").replace(/\bchequing\b/g,"checking")
  .replace(/\bcheque/g,"check").replace(/\baluminium\b/g,"aluminum").replace(/\bsulphur/g,"sulfur")
  .replace(/\bsignalling\b/g,"signaling").replace(/\bturkiye\b/g,"turkey")
  .replace(/([a-z]{3,})isation\b/g,"$1ization").replace(/([a-z]{3,})ising\b/g,"$1izing").replace(/([a-z]{3,})ise\b/g,"$1ize")
  .replace(/\b(the|a|an|of)\b/g," ").replace(/\s+/g," ").trim();
function stemWord(w){
  if(w.length>=5&&w.endsWith("ies"))return w.slice(0,-3)+"y";
  if(w.length>=5&&/(sses|xes|ches|shes)$/.test(w))return w.slice(0,-2);
  if(w.length>=4&&w.endsWith("s")&&!/(ss|us|is|os)$/.test(w))return w.slice(0,-1);
  return w;
}
const stemStr=s=>s.split(" ").map(stemWord).join(" ");
function dlev(a,b,maxD=3){
  const n=a.length,m=b.length;if(Math.abs(n-m)>maxD)return 99;
  const d=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=0;i<=n;i++)d[i][0]=i;
  for(let j=0;j<=m;j++)d[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    const cost=a[i-1]===b[j-1]?0:1;
    let v=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+cost);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,d[i-2][j-2]+1);
    d[i][j]=v;
  }
  return d[n][m];
}
const SUFFIX_RE=/\b(curve|law|effect|paradox|puzzle|fallacy|theorem|model|index|ratio|tax|rate|goods|good|bias|heuristic|theory|game|rule|crisis|bubble|crash|problem|principle|system|policy|market)$/;
function compilePrompt(P){
  P.reject=Object.fromEntries(Object.entries(P.reject||{}).map(([k,v])=>[norm(k),v]));
  P.answers=P.a.split("\n").map(l=>{
    const [t,d,al]=l.split("|");
    const aliases=new Set([norm(d)]);
    (al||"").split(";").forEach(x=>{const nx=norm(x);if(nx)aliases.add(nx);});
    if(P.people){const parts=norm(d).split(" ");aliases.add(parts[parts.length-1]);}
    return {tier:+t,d,aliases:[...aliases].filter(Boolean)};
  }).filter(a=>a.aliases.length);
  if(!P.people){
    const existing=new Set(),baseCounts=new Map();
    for(const a of P.answers)for(const al of a.aliases)existing.add(al);
    for(const a of P.answers){
      const base=norm(a.d).replace(SUFFIX_RE,"").trim();
      if(base.length>=4&&base!==norm(a.d)&&!P.reject[base]&&!existing.has(base)){
        a._base=base;baseCounts.set(base,(baseCounts.get(base)||0)+1);
      }
    }
    for(const a of P.answers){if(a._base&&baseCounts.get(a._base)===1)a.aliases.push(a._base);delete a._base;}
  }
  for(const a of P.answers){
    a.variants=a.aliases.map(al=>{
      const st=P.people?al:stemStr(al);
      return {al,st,flat:st.replace(/ /g,""),toks:st.split(" ").filter(Boolean)};
    });
  }
  return P;
}
PROMPTS.forEach(compilePrompt);

const DAILY_DROPS={};
let DAILY_MANIFEST=new Set();
async function loadDailyManifest(){
  if(typeof fetch!=="function"||typeof location==="undefined"||!/^https?:/.test(location.protocol))return;
  try{
    const r=await fetch("./daily/index.json",{cache:"no-store"});
    if(!r.ok)return;
    const d=await r.json();
    if(d&&Array.isArray(d.drops))DAILY_MANIFEST=new Set(d.drops);
  }catch(e){}
}
async function loadDailyDrop(key){
  if(DAILY_DROPS[key])return DAILY_DROPS[key];
  if(typeof fetch!=="function"||typeof location==="undefined"||!/^https?:/.test(location.protocol))return null;
  try{
    const r=await fetch(`./daily/${key}.json`,{cache:"no-store"});

function judge(P,raw){
  const s=norm(raw); if(!s) return null;
  const st=P.people?s:stemStr(s);
  if(P.reject[s]) return {miss:P.reject[s]};
  if(P.reject[st]) return {miss:P.reject[st]};
  if(P.rejectRe) for(const [re,msg] of P.rejectRe) if(re.test(s)||re.test(st)) return {miss:msg};
  const sFlat=st.replace(/ /g,""),sToks=st.split(" ").filter(Boolean),sSig=sToks.filter(t=>t.length>=3);
  let best=null,bestScore=0;
  for(const a of P.answers) for(const v of a.variants){
    let sc=0;
    if(s===v.al||st===v.st||(sFlat.length>=4&&sFlat===v.flat)) sc=1000+v.al.length;
    else if(v.st.length>=3&&((" "+s+" ").includes(" "+v.al+" ")||(" "+st+" ").includes(" "+v.st+" "))) sc=500+v.al.length;
    else if(st.length>=4&&(" "+v.st+" ").includes(" "+st+" ")) sc=350+st.length;
    else if(sToks.length>=2&&v.toks.length>=2&&sSig.length>=2){
      const matched=new Set();let ok=true;
      for(const u of sSig){
        const tol=u.length>=6?2:1;let hitIdx=-1;
        for(let j=0;j<v.toks.length;j++){if(dlev(u,v.toks[j],tol)<=tol){hitIdx=j;break;}}
        if(hitIdx<0){ok=false;break;}
        matched.add(hitIdx);
      }
      if(ok&&matched.size>=Math.max(2,v.toks.length-1)) sc=280+v.al.length;
    }
    if(!sc&&v.flat.length>=5&&sFlat.length>=4){
      const tol=v.flat.length>=12&&sFlat.length>=10?3:(v.flat.length>=7&&sFlat.length>=6?2:1);
      if(dlev(sFlat,v.flat,tol)<=tol) sc=200+v.al.length;
    }
    if(sc>bestScore){bestScore=sc;best=a;}
  }
  return best?{hit:best}:{miss:null};
}

  }else if(kind==="pass"){

  const keys=[[0,from,segs[0].col,segs[0].spd]];

    $("rMeta").textContent=(T?`TIER ${e.tier} OF 6 · 1 OF ${P.answers.length} ACCEPTED`:`0 OF ${P.answers.length} ACCEPTED`)+metaTags;
    $("rFlav").textContent=T?T.flav:note;
    const gainMult=Math.pow(10,12*Math.max(0,e.altDelta)/700),dropMult=Math.pow(10,12*Math.abs(e.altDelta)/700);
    $("rMult").textContent=e.altDelta>0?`STOCK ×${fmtMult(gainMult)}`:(e.altDelta<0?`STOCK ÷${fmtMult(dropMult)}`:"");
    show("reveal");revealAt=performance.now();
    ["rIcon","rAns","rPts"].forEach((id,k)=>{const el=$(id);el.classList.remove("pop");void el.offsetWidth;el.style.animationDelay=(k*.08)+"s";el.classList.add("pop");});
    $("rIcon").style.animation="popin .45s cubic-bezier(.3,1.7,.5,1) both, float 2.4s ease-in-out .5s infinite";
    const st=$("rTier");st.classList.remove("slam");void st.offsetWidth;st.classList.add("slam");
    if(T){
      if(e.tier===6)jackpot();
      else{SCN.mood=e.tier===1?"nervous":"happy";SCN.floats.push({t:e.altDelta>=0?`×${fmtMult(gainMult)}`:`÷${fmtMult(dropMult)}`,x:HEAD_X()+14,y:valToY(G.alt)-10,c:T.c,life:100});}
      say(pickL(e.tier),1700);
    }else if(passed){
      SCN.mood="idle";say(pickL("pass"),1700);
    }else{
      SCN.mood="sad";sfx.miss();say(pickL(usedLev?"liq":(timeout&&!norm(raw)?"closed":"miss")),1700);
      if(usedLev){$("reveal").classList.add("bigshake");$("hud").classList.add("bigshake");setTimeout(()=>{$("reveal").classList.remove("bigshake");$("hud").classList.remove("bigshake");},680);}
      else{$("reveal").classList.add("shake");setTimeout(()=>$("reveal").classList.remove("shake"),400);}
    }
    show("nextWrap");$("nextBtn").textContent=G.i+1<ROUNDS?"ASCEND ▲":"CASH OUT ▲";setTimeout(()=>$("nextBtn").focus(),200);
    $("nextBtn").onclick=()=>{$("rays").classList.remove("on");G.i++;G.i<ROUNDS?ask():finish();};
  };
  playWaveMove(prevAlt,G.alt,kind,showOutcome);
}
function jackpot(){
  const f=$("flash");f.style.transition="none";f.style.background="#fff";f.style.opacity=.95;
  setTimeout(()=>{f.style.transition="opacity 1s";f.style.background="#f5c542";f.style.opacity=.45;setTimeout(()=>f.style.opacity=0,280);},140);
  $("rays").classList.add("on");SCN.rain=180;SCN.goldBill=900;SCN.mood="star";SCN.punch=.28;SCN.shake=12;sfx.jackpot();

  setTimeout(()=>{$("reveal").classList.remove("bigshake");$("hud").classList.remove("bigshake");},680);
  const jx=HEAD_X(),jy=Math.max(14,Math.min(H-14,valToY(G?G.alt:0)));
  for(let i=0;i<24;i++)SCN.coins.push({x:jx,y:jy,vx:rnd(-2.2,2.2),vy:rnd(-2.6,-.4),r:rnd(0,6)});
  try{navigator.vibrate&&navigator.vibrate([80,40,80,40,220]);}catch(e){}

}
function finish(){
  const res={score:G.score,alt:G.alt,speed:G.speed,grid:G.log.map(e=>e.tier?TIERS[e.tier].e:"🟥").join(""),log:G.log};
  const st=store.get("vebl-stats")||{played:0,bestScore:0,bestAlt:0,totalScore:0};
  st.played++;st.totalScore+=res.score;st.bestScore=Math.max(st.bestScore,res.score);st.bestAlt=Math.max(st.bestAlt,res.alt);
  store.set("vebl-stats",st);
  if(G.mode==="daily"){store.set("vebl-"+G.meta.key,res);bumpStreak();}
  else if(G.mode==="archive"){store.set("vebl-"+G.meta.key,res);}
  else if(G.mode==="pack"){
    const pk="vebl-pack-"+G.meta.id,prev=store.get(pk);
    const best=prev&&prev.bestScore>res.score?prev:{bestScore:res.score,bestAlt:res.alt,bestGrid:res.grid};
    store.set(pk,{...res,bestScore:best.bestScore,bestAlt:best.bestAlt,bestGrid:best.bestGrid});
  }else if(G.mode==="challenge"){clearChallenge();}
  results(res,G.mode,G.meta);
}

  }).join("");
  const chHtml=`
    <div class="panel acard" style="display:block">
      <div class="atitle">CREATE A FRIEND CHALLENGE · ${SPEEDS[speedMode].label}</div>
      <div class="adate">Play 7 seeded prompts and send your score to beat, or copy a blank duel link.</div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn gold small" style="flex:1" onclick="startNewChallenge()">PLAY &amp; CHALLENGE ▲</button>
        <button class="btn ghost small" onclick="copyBlankChallenge()">COPY LINK</button>
      </div>
    </div>
    <div class="panel acard" style="display:block">

      <div class="adate">Paste a #challenge= URL or VEBL-… code below to play the exact same 7 prompts.</div>
      <form id="chForm" class="chform"><input id="chInput" placeholder="paste link or VEBL-… code" autocomplete="off" spellcheck="false"><button class="btn mint small" type="submit">ACCEPT ▲</button></form>
      <div id="chMsg" class="adate" style="margin-top:8px"></div>
    </div>`;
  const bodyHtml=tab==="days"
    ?daysHtml+`<div class="archnote">A fresh 7-prompt climb unlocks daily at midnight (${Math.floor(PROMPTS.length/ROUNDS)} consecutive days with zero repeats across all ${PROMPTS.length} evergreen prompts, plus live midnight JSON drops). Want more right now? Switch to Vault Climbs or Unlimited ∞!</div>`
    :(tab==="vault"
      ?vaultHtml+`<div class="archnote">All ${PROMPTS.length} prompts organized into ${PACKS.length} curated 7-round climbs.</div>`

  $("archive").innerHTML=`<div class="arch">

    <div class="statrow">

      <div class="panel statbox"><div class="slbl">AVG PTS</div><div class="sval">${avg}</div></div>
      <div class="panel statbox"><div class="slbl">STREAK</div><div class="sval">${activeStreak()}D</div></div>

  const chf=$("chForm");

    start("challenge",parsed);

function tradeLog(log){
  const w=480,h=200,pl=54,pr=10,pt=22,pb=26,cw=(w-pl-pr)/ROUNDS;
  let run=0,vals=[0];
  log.forEach(e=>{const d=e.altDelta!=null?e.altDelta:ALTG[e.tier||0];run=Math.max(ALT_MIN,Math.min(ALT_MAX,run+d));vals.push(run);});
  const vmin=Math.min(...vals),vmax=Math.max(...vals);
  let lo=Math.floor(vmin/DECADE)*DECADE,hi=Math.ceil(vmax/DECADE)*DECADE;
  if(hi-lo<DECADE*2){const mid=(lo+hi)/2;lo=Math.floor((mid-DECADE)/DECADE)*DECADE;hi=lo+DECADE*2;}
  if(hi-vmax<DECADE*0.25)hi+=DECADE*0.5;
  if(vmin-lo<DECADE*0.25)lo-=DECADE*0.5;
  const y=s=>pt+(h-pt-pb)*(1-(s-lo)/(hi-lo));
  let svg=`<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">`;
  const dMin=Math.ceil(lo/DECADE),dMax=Math.floor(hi/DECADE),dStep=Math.max(1,Math.ceil((dMax-dMin)/6));
  for(let d=dMin;d<=dMax;d+=dStep){
    const s=d*DECADE;
    svg+=`<line x1="${pl}" x2="${w-pr}" y1="${y(s).toFixed(1)}" y2="${y(s).toFixed(1)}" stroke="#1d2b52" stroke-dasharray="3 4"/><text x="${pl-6}" y="${(y(s)+4).toFixed(1)}" text-anchor="end" fill="#5f73a0" font-family="VT323" font-size="15">${money(s)}</text>`;
  }
  run=0;
  log.forEach((e,k)=>{
    const x=pl+cw*k+cw*.25,bw=cw*.5,d=e.altDelta!=null?e.altDelta:ALTG[e.tier||0],a=run,b=Math.max(ALT_MIN,Math.min(ALT_MAX,run+d));run=b;
    const c=e.tier?TIERS[e.tier].c:"#ff5a6e",stroke=e.lev?' stroke="#f5c542" stroke-width="1.5"':"";
    if(b>a){svg+=`<line x1="${x+bw/2}" x2="${x+bw/2}" y1="${y(b)-6}" y2="${y(a)+4}" stroke="${c}" stroke-width="2"/><rect x="${x}" y="${y(b)}" width="${bw}" height="${Math.max(3,y(a)-y(b))}" fill="${c}"${stroke}/>`;}
    else if(b<a){svg+=`<line x1="${x+bw/2}" x2="${x+bw/2}" y1="${y(a)-4}" y2="${y(b)+6}" stroke="${c}" stroke-width="2"/><rect x="${x}" y="${y(a)}" width="${bw}" height="${Math.max(4,y(b)-y(a))}" fill="${c}"${stroke}/>`;}
    else{svg+=`<rect x="${x}" y="${y(a)}" width="${bw}" height="8" fill="${c}"/><line x1="${x+bw/2}" x2="${x+bw/2}" y1="${y(a)-3}" y2="${y(a)+12}" stroke="${c}" stroke-width="2"/>`;}
    svg+=`<text x="${x+bw/2}" y="${h-8}" text-anchor="middle" fill="#5f73a0" font-family="VT323" font-size="15">${k+1}</text>`;
  });
  return svg+"</svg>";
}
function results(res,mode="daily",meta={}){
  if(mode===true)mode="daily";else if(mode===false)mode="unlimited";
  hideAll();SCN.hideHead=true;show("results");
  if(res.alt==null)res.alt=altOf(res.log);const rk=rankOf(res.alt);
  const dn=meta.dayNum||dayNo, sp=SPEEDS[res.speed]||SPEEDS.standard;
  const spTag=sp.id!=="standard"?" · "+sp.n.toUpperCase():"";
  const tag=mode==="daily"?"#"+dn:(mode==="archive"?"#"+dn+" (Archive)":(mode==="pack"?"· "+meta.name:(mode==="challenge"?"⚔":"∞")));
  const headLbl=mode==="daily"?"CLIMB #"+dn+" COMPLETE":(mode==="archive"?"ARCHIVE #"+dn+" COMPLETE":(mode==="pack"?meta.name.toUpperCase()+" COMPLETE":(mode==="challenge"?"CHALLENGE COMPLETE":"UNLIMITED COMPLETE")));

  const text=`VEBL ${tag}${sp.id!=="standard"?" ["+sp.n.toUpperCase()+"]":""} — ${money(res.alt)} (${ptsStr})\n${res.grid}\n${rk[1]}`;

    const verdict=res.score>meta.targetScore?"🏆 YOU WIN!":(res.score<meta.targetScore?"📉 CHALLENGER WINS":"🤝 TIE CLIMB!");
    const vcol=res.score>meta.targetScore?"var(--mint)":(res.score<meta.targetScore?"var(--red)":"var(--gold)");
    return `<div class="panel h2h"><div class="h2ht" style="color:${vcol}">${verdict}</div><div class="h2hg"><div class="h2hcol"><div class="px" style="font-size:9px;color:var(--mint)">YOU</div><div class="vt" style="font-size:26px">${res.score} · ${money(res.alt)}</div><div>${res.grid}</div></div><div class="h2hcol"><div class="px" style="font-size:9px;color:var(--gold)">FRIEND</div><div class="vt" style="font-size:26px">${meta.targetScore} · ${money(meta.targetAlt)}</div><div>${meta.targetGrid||""}</div></div></div></div>`;
  })():"";
  const reached=MS.filter((m,i)=>i===0||res.alt>=m.s-.5);
  const cIds=res.log.map(e=>e.id||(PROMPTS.find(p=>p.cat===e.cat)||{}).id).filter(Boolean);
  $("results").innerHTML=`<div class="res">
   <div class="rhead"><div class="chroma">VEBL</div><div class="px">${esc(headLbl+spTag)}</div></div>
   <div class="bigscore"><div class="vt">${res.score}</div><div class="cap">${money(res.alt)}</div></div>
   <div class="rankline">${rk[1]} · ${rk[2]}</div>
   ${h2hHtml}
   <div class="sec">STOCK CHART <span style="color:#3b5185">LOG SCALE</span></div>
   <div class="panel" id="log" style="padding:10px">${tradeLog(res.log)}</div>
   <div class="recap" style="margin-top:8px">${res.log.map((e,k)=>{
     const P=(e.id&&PROMPT_BY_ID[e.id])||PROMPTS.find(p=>p.cat===e.cat);
     const ans=e.d?esc(e.d):(e.passed?"passed":(e.raw?"<s>"+esc(e.raw)+"</s>":"—"));
     const tags=(e.lev?`<span class="rtag" style="color:var(--gold)">2×</span>`:"")+(e.tip?`<span class="rtag" style="color:var(--t4)">TIP</span>`:"");
     const mnote=[e.lev?"⚡ 2× Leveraged":"",e.tip?"🕵 Insider Tip (-20)":""].filter(Boolean).join(" · ");
     return `<details class="rdet"><summary><span class="rcat">${k+1}. ${esc(e.cat)}</span><span style="color:${e.tier?TIERS[e.tier].c:"var(--red)"}">${ans}${tags} · ${e.pts}</span></summary><div class="rdet-body"><div class="rdet-q">${esc(e.q||(P&&P.q)||"")}</div>${mnote?`<div>${mnote}</div>`:""}</div></details>`;
   }).join("")}</div>
   <div class="sec">YOUR POSITION</div>
   <div class="panel" style="padding:12px">
     <div style="font-size:13px;color:var(--ink)"><b>${esc(rk[1])}</b> · <span style="color:var(--mint)">${money(res.alt)}</span> <span style="color:var(--mute)">— ${esc(rk[2])}</span></div>
     <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${reached.map(m=>`<span class="rtag" style="color:var(--gold);margin-left:0">${m.v} · ${m.n}</span>`).join("")}</div>
   </div>
   <div class="rankline" style="margin-top:14px;text-align:center">★ MONOPOLY CLUB: ${store.get("vebl-tclub")||0} LIFETIME ★</div>
   <div class="btnrow"><button class="btn gold" id="cp" style="flex:1">COPY RESULT</button>${cIds.length===ROUNDS?`<button class="btn ghost" id="chBtn" style="flex:1">⚔ CHALLENGE</button>`:""}</div>
   <div id="chOut" class="tipbox hide"></div>
   <button class="btn mint" style="margin-top:10px" onclick="start('unlimited')">KEEP CLIMBING ∞</button>
   <div class="btnrow"><button class="btn ghost small" onclick="home()">◄ HOME</button><button class="btn ghost small" onclick="openArchive('${mode==="pack"?"vault":(mode==="challenge"?"challenge":"days")}')">ARCHIVE &amp; VAULT</button></div>
  </div>`;
  $("results").scrollTop=0;
  $("cp").onclick=async ev=>{try{await navigator.clipboard.writeText(text);ev.target.textContent="COPIED!";}catch(err){ev.target.textContent="SCREENSHOT IT!";}};
  const chBtn=$("chBtn");
  if(chBtn)chBtn.onclick=async ev=>{
    const tok=encodeChallenge(cIds,res.speed||"standard",{score:res.score,alt:res.alt,tiers:res.log.map(e=>e.tier||0).join("")});
    const isWeb=typeof location!=="undefined"&&/^https?:/.test(location.protocol);
    const link=isWeb?challengeUrl(tok):"VEBL-"+tok;
    const blurb=`Beat my ${res.score} pts (${money(res.alt)}) on VEBL!\n${res.grid}\n${isWeb?link+"\nCode: VEBL-"+tok:link}`;
    try{await navigator.clipboard.writeText(blurb);ev.target.textContent="LINK COPIED!";}
    catch(err){$("chOut").innerHTML=`Copy &amp; send: <code>${esc(link)}</code>`;show("chOut",true);}
  };
}
