<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#070d1e"/>
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#2c4170" stroke-width="1"/>
  <!-- Upward ticker line behind the dollar bill -->
  <rect x="2" y="27" width="3" height="2" fill="#4ef2a3"/>
  <rect x="5" y="25" width="3" height="2" fill="#4ef2a3"/>
  <rect x="8" y="26" width="3" height="2" fill="#4ef2a3"/>
  <rect x="11" y="23" width="3" height="2" fill="#4ef2a3"/>
  <rect x="24" y="6" width="2" height="3" fill="#4ef2a3"/>
  <rect x="26" y="4" width="2" height="2" fill="#f5c542"/>
  <rect x="27" y="3" width="2" height="2" fill="#f5c542"/>
  <!-- Drop shadow -->
  <rect x="5" y="11" width="26" height="15" fill="#03060f"/>
  <!-- Dollar bill dark outer border -->
  <rect x="3" y="9" width="26" height="15" fill="#2f5d27"/>
  <!-- Dollar bill face -->
  <rect x="4" y="10" width="24" height="13" fill="#9fd18a"/>
  <!-- Inner trim frame -->
  <rect x="5" y="11" width="22" height="1" fill="#6da35a"/>
  <rect x="5" y="21" width="22" height="1" fill="#6da35a"/>
  <rect x="5" y="11" width="1" height="11" fill="#6da35a"/>
  <rect x="26" y="11" width="1" height="11" fill="#6da35a"/>
  <!-- Corner denomination marks -->
  <rect x="7" y="13" width="1" height="3" fill="#1e3d18"/>
  <rect x="24" y="17" width="1" height="3" fill="#1e3d18"/>
  <!-- Center oval -->
  <rect x="12" y="12" width="8" height="9" fill="#d8efc9"/>
  <rect x="11" y="13" width="10" height="7" fill="#d8efc9"/>
  <!-- Happy squinting pixel eyes -->
  <rect x="12" y="15" width="1" height="1" fill="#1e3d18"/>
  <rect x="13" y="14" width="1" height="1" fill="#1e3d18"/>
  <rect x="14" y="15" width="1" height="1" fill="#1e3d18"/>
  <rect x="17" y="15" width="1" height="1" fill="#1e3d18"/>
  <rect x="18" y="14" width="1" height="1" fill="#1e3d18"/>
  <rect x="19" y="15" width="1" height="1" fill="#1e3d18"/>
  <!-- Blush & smile -->
  <rect x="11" y="17" width="1" height="1" fill="#ff9ec4"/>
  <rect x="20" y="17" width="1" height="1" fill="#ff9ec4"/>
  <rect x="13" y="17" width="1" height="1" fill="#1e3d18"/>
  <rect x="18" y="17" width="1" height="1" fill="#1e3d18"/>
  <rect x="14" y="18" width="4" height="1" fill="#1e3d18"/>
</svg>
